<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>

    <!-- tailwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- favicon -->
    <link rel="shortcut icon" href="jobs.png" type="image/x-icon">

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">

    <!-- external css -->
    <link rel="stylesheet" href="styles/style.css">

    <style>
        * {
            font-family: "Geist", sans-serif;
            font-optical-sizing: auto;
        }
    </style>

</head>

<body class="bg-[#F8FAFC]">
    <header>
        <section class="container mx-auto pt-16">
            <h1 class="color-black font-bold">Job Application Tracker</h1>
            <div class="grid grid-cols-3 gap-4 mt-5">
                <div class="bg-white p-5 rounded-[8px] border border-[#f1f2f4]">
                    <p>Total</p>
                    <h3 id="total">0</h3>
                </div>

                <div class="bg-white p-5 rounded-[8px] border border-[#f1f2f4]">
                    <p>Interview</p>
                    <h3 id="interview" class="color-green font-bold">0</h3>
                </div>

                <div class="bg-white p-5 rounded-[8px] border border-[#f1f2f4]">
                    <p>Rejected</p>
                    <h3 id="rejected" class="color-red font-bold">0</h3>
                </div>
            </div>
        </section>
    </header>
</body>

</html>
